<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>GitHub Cloud Storage</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* === Estilos base melhorados para mobile === */
        * {
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #f8fafc;
            overflow-x: hidden;
        }

        /* Botões com tamanho de toque mínimo (44px) */
        button, 
        .btn-action,
        .file-item .btn-preview,
        .file-item .btn-move,
        .file-item .btn-rename,
        .file-item .btn-delete,
        .view-mode-btn,
        .size-btn,
        #btn-new-folder,
        label[for="file-upload"],
        #btn-multi-select,
        #btn-delete-selected,
        #btn-move-selected,
        #back-button {
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        /* Aumentar área de clique dos ícones na lista */
        .file-item button {
            width: 36px;
            height: 36px;
        }

        /* Ocultar textos em mobile – apenas ícones */
        @media (max-width: 640px) {
            .action-text {
                display: none !important;
            }
            .btn-action span,
            #btn-new-folder span,
            label span,
            #btn-multi-select span,
            #btn-delete-selected span,
            #btn-move-selected span {
                display: none;
            }
            /* Mantém apenas o ícone visível */
            .btn-action i,
            #btn-new-folder i,
            label i,
            #btn-multi-select i,
            #btn-delete-selected i,
            #btn-move-selected i {
                margin-right: 0 !important;
                font-size: 1.25rem;
            }
            /* Botões redondos no mobile */
            #btn-new-folder,
            label,
            #btn-multi-select,
            #btn-delete-selected,
            #btn-move-selected,
            #back-button {
                width: 44px;
                padding: 0 !important;
                border-radius: 9999px !important;
            }
            /* Ajustar layout da barra de acções */
            .actions-bar {
                flex-wrap: nowrap;
                justify-content: space-between;
            }
            /* Breadcrumbs mais compacto */
            #breadcrumbs {
                font-size: 0.7rem;
            }
        }

        /* Animações e transições suaves */
        .file-item {
            transition: background 0.15s ease;
        }
        .file-item:hover {
            background: #f1f5f9;
        }
        #drop-zone.dragover {
            background: #eef2ff;
            border: 2px dashed #4f46e5;
        }
        .system-file {
            opacity: 0.6;
        }
        .progress-bar {
            transition: width 0.3s ease;
        }

        /* Suporte para line-clamp (modo grelha) */
        .line-clamp-1 { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .line-clamp-3 { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

        /* Scroll suave */
        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-900">

<div class="container mx-auto px-4 py-4 max-w-6xl">
    <!-- HEADER -->
    <header class="flex flex-col sm:flex-row justify-between items-center mb-6 gap-4">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-2xl shadow-lg shadow-indigo-200">
                <i class="fab fa-github text-white text-2xl"></i>
            </div>
            <div>
                <h1 class="text-xl font-black">GitHub <span class="text-indigo-600">Cloud</span></h1>
                <p class="text-[9px] font-bold text-slate-400 uppercase">Storage Manager</p>
            </div>
        </div>

        <div id="auth-section" class="flex w-full sm:w-auto gap-2">
            <input type="password" id="github-token" placeholder="Token" class="flex-1 sm:w-72 px-4 py-2 bg-white border rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500">
            <button id="btn-login" class="bg-indigo-600 text-white px-6 py-2 rounded-2xl font-bold hover:bg-indigo-700">Conectar</button>
        </div>

        <div id="user-section" class="hidden items-center gap-3 bg-white p-1 pr-4 rounded-2xl shadow-sm">
            <div class="w-10 h-10 bg-indigo-50 rounded-xl flex items-center justify-center">
                <i class="fas fa-user text-indigo-500"></i>
            </div>
            <div>
                <span id="repo-info" class="text-sm font-black text-slate-800"></span>
                <button id="btn-logout" class="text-[9px] text-red-500 font-black block">Sair</button>
            </div>
        </div>
    </header>

    <!-- MAIN APP (inicialmente oculto) -->
    <main id="app-content" class="hidden grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- SIDEBAR -->
        <div class="lg:col-span-3 space-y-5">
            <div class="bg-white p-5 rounded-2xl shadow-sm">
                <h3 class="text-xs font-bold text-slate-400 uppercase mb-3">Armazenamento Total</h3>
                <div class="flex items-end gap-2">
                    <span id="total-storage-usage" class="text-2xl font-black">0 KB</span>
                </div>
                <p id="total-file-count" class="text-xs text-slate-500 mt-1">0 ficheiros</p>
                <div class="w-full bg-slate-100 h-2 rounded-full mt-3">
                    <div id="storage-progress" class="bg-indigo-500 h-full rounded-full" style="width: 0%"></div>
                </div>
                <p class="text-[10px] text-slate-400 mt-2">Limite: 50 GB</p>
            </div>

            <div class="bg-indigo-600 p-5 rounded-2xl shadow-lg text-white">
                <h3 class="text-xs font-bold text-indigo-200 uppercase">Nesta Pasta</h3>
                <div class="flex justify-between mt-3">
                    <span class="text-sm">Ficheiros:</span>
                    <span id="folder-file-count" class="font-black">0</span>
                </div>
                <div class="flex justify-between mt-1">
                    <span class="text-sm">Tamanho:</span>
                    <span id="folder-storage-usage" class="font-black">0 KB</span>
                </div>
            </div>

            <div class="bg-amber-50 p-4 rounded-2xl">
                <div class="flex items-center gap-2">
                    <i class="fas fa-shield-alt text-amber-600"></i>
                    <span class="text-xs font-bold text-amber-800">Protegidos</span>
                </div>
                <p class="text-[10px] text-amber-700 mt-1">index.html, app.js, assets/</p>
            </div>
        </div>

        <!-- MAIN PANEL -->
        <div class="lg:col-span-9 space-y-4">
            <!-- Barra de navegação e pesquisa -->
            <div class="flex flex-wrap justify-between items-center gap-2">
                <nav class="text-sm font-bold overflow-x-auto" id="breadcrumbs"></nav>
                <div class="relative w-full sm:w-64">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                    <input type="text" id="search-input" placeholder="Pesquisar..." class="w-full pl-8 pr-3 py-2 bg-white border rounded-2xl text-sm focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <!-- FILE MANAGER CARD -->
            <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
                <!-- Barra de acções (botões apenas com ícones em mobile) -->
                <div class="actions-bar flex flex-wrap items-center justify-between gap-2 p-3 border-b bg-slate-50/30">
                    <div class="flex gap-2">
                        <button id="btn-new-folder" class="bg-white border px-4 py-2 rounded-xl text-slate-600 hover:border-indigo-300 shadow-sm" title="Nova pasta">
                            <i class="fas fa-folder-plus text-amber-500 mr-1"></i><span class="action-text text-sm">Pasta</span>
                        </button>
                        <label class="bg-indigo-600 text-white px-4 py-2 rounded-xl cursor-pointer shadow-md hover:bg-indigo-700" title="Upload">
                            <i class="fas fa-cloud-upload-alt mr-1"></i><span class="action-text text-sm">Upload</span>
                            <input type="file" id="file-upload" class="hidden" multiple>
                        </label>
                    </div>
                    <div class="flex gap-2">
                        <span id="status-msg" class="text-[9px] font-bold text-indigo-500 uppercase hidden sm:inline"></span>
                        <button id="btn-refresh" class="w-10 h-10 text-slate-400 hover:text-indigo-600 rounded-xl">
                            <i class="fas fa-sync-alt"></i>
                        </button>
                    </div>
                </div>

                <!-- Drop zone e lista de ficheiros -->
                <div id="drop-zone" class="transition-all min-h-[400px]">
                    <div id="list-header" class="grid grid-cols-12 gap-2 px-5 py-3 bg-slate-50/50 text-[10px] font-bold text-slate-400 uppercase border-b">
                        <div class="col-span-7 md:col-span-8">Nome</div>
                        <div class="col-span-3 md:col-span-2 text-right hidden sm:block">Tamanho</div>
                        <div class="col-span-5 sm:col-span-2 text-right">Ações</div>
                    </div>
                    <div id="view-controls-container"></div>
                    <div id="file-list" class="divide-y"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- TELA DE BOAS-VINDAS -->
    <div id="welcome-screen" class="bg-white p-10 rounded-3xl shadow-xl text-center max-w-2xl mx-auto mt-8">
        <div class="w-20 h-20 bg-indigo-50 rounded-2xl flex items-center justify-center mx-auto mb-6">
            <i class="fas fa-cloud-upload-alt text-4xl text-indigo-600"></i>
        </div>
        <h2 class="text-2xl font-black">Enterprise Storage</h2>
        <p class="text-slate-500 my-4">Gestão profissional com movimentação entre pastas</p>
        <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="p-3 bg-slate-50 rounded-xl"><i class="fas fa-exchange-alt text-indigo-500"></i><p class="text-[10px] mt-1">Mover</p></div>
            <div class="p-3 bg-slate-50 rounded-xl"><i class="fas fa-folder-lock text-amber-500"></i><p class="text-[10px] mt-1">Protegido</p></div>
            <div class="p-3 bg-slate-50 rounded-xl"><i class="fas fa-hdd text-green-500"></i><p class="text-[10px] mt-1">50 GB</p></div>
        </div>
        <button onclick="document.getElementById('github-token').focus()" class="bg-slate-900 text-white px-6 py-3 rounded-xl font-black hover:bg-indigo-600">Aceder</button>
    </div>
</div>

<!-- MODAL GENÉRICO -->
<div id="modal-input" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl p-6 w-full max-w-md">
        <div class="flex items-center gap-3 mb-4">
            <div id="modal-icon-bg" class="p-3 rounded-xl bg-indigo-100"><i id="modal-icon" class="text-indigo-600 text-xl"></i></div>
            <div><h3 id="modal-title" class="text-xl font-black">Título</h3><p id="modal-subtitle" class="text-xs text-slate-400"></p></div>
        </div>
        <div id="move-folder-select-container" class="hidden mb-4">
            <select id="move-folder-select" class="w-full p-3 bg-slate-50 border rounded-xl"></select>
        </div>
        <div id="generic-input-container" class="hidden mb-4">
            <input type="text" id="generic-input" class="w-full p-3 bg-slate-50 border rounded-xl" placeholder="Nome">
        </div>
        <div class="flex justify-end gap-2">
            <button id="btn-modal-cancel" class="px-4 py-2 text-slate-500 font-bold">Cancelar</button>
            <button id="btn-modal-confirm" class="px-4 py-2 bg-indigo-600 text-white font-bold rounded-xl">Confirmar</button>
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
